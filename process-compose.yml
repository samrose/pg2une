version: "0.5"

processes:
  postgres-init:
    command: |
      if [ ! -f .pg_data/PG_VERSION ]; then
        echo "Initializing PostgreSQL data directory..."
        initdb -D .pg_data --no-locale --encoding=UTF8
        # Enable pg_stat_statements for metrics collection
        echo "shared_preload_libraries = 'pg_stat_statements'" >> .pg_data/postgresql.conf
        echo "pg_stat_statements.track = 'all'" >> .pg_data/postgresql.conf
      else
        echo "PostgreSQL data directory already initialized."
      fi
    availability:
      restart: "no"

  postgres:
    command: postgres -D .pg_data
    depends_on:
      postgres-init:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: pg_isready -h localhost -d postgres
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 10
    shutdown:
      signal: 2

  db-setup:
    command: |
      mix deps.get && mix ecto.setup
      # Create mxc database and run its migrations
      createdb -h localhost mxc_dev 2>/dev/null || true
      mix ecto.migrate --repo Mxc.Repo 2>/dev/null || true
      # Create pg_stat_statements extension on the target database
      psql -h localhost -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" 2>/dev/null || true
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"

  app:
    command: mix run --no-halt
    depends_on:
      db-setup:
        condition: process_completed_successfully
    shutdown:
      signal: 2

  # Optional workload generators — disabled by default.
  # Start with: process-compose up workload-oltp
  # Or: PG2UNE_BENCH_DURATION=600 process-compose up workload-mixed

  workload-init:
    command: pg2une-bench init
    depends_on:
      db-setup:
        condition: process_completed_successfully
    availability:
      restart: "no"
    disabled: true

  workload-oltp:
    command: pg2une-bench oltp
    depends_on:
      workload-init:
        condition: process_completed_successfully
      app:
        condition: process_started
    disabled: true

  workload-olap:
    command: pg2une-bench olap
    depends_on:
      workload-init:
        condition: process_completed_successfully
      app:
        condition: process_started
    disabled: true

  workload-mixed:
    command: pg2une-bench mixed
    depends_on:
      workload-init:
        condition: process_completed_successfully
      app:
        condition: process_started
    disabled: true

  workload-degrade:
    command: pg2une-bench degrade
    depends_on:
      workload-init:
        condition: process_completed_successfully
      app:
        condition: process_started
    disabled: true
